services:
  mysql:
    image: mysql:8.0
    container_name: technicel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-technicel}
      MYSQL_USER: ${DB_USERNAME:-technicel}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - technicel_mysql_prod_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=96M --performance-schema=0 --max-connections=20
    mem_limit: 280m
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  technicel_mysql_prod_data:
