services:
  mysql:
    image: mysql:8.0
    container_name: technicel-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-technicel}
      MYSQL_USER: ${DB_USERNAME:-technicel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-technicel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - technicel_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  technicel_mysql_data:
