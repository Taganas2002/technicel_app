services:
  mysql:
    image: mysql:8.0
    container_name: technicel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-technicel}
      MYSQL_USER: ${DB_USERNAME:-technicel}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - technicel_mysql_prod_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M --performance-schema=0 --max-connections=30
    mem_limit: 350m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "3306"

  backend:
    image: eclipse-temurin:17-jre
    container_name: technicel-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - ./backend/app.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-technicel}
      DB_USERNAME: ${DB_USERNAME:-technicel}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_NIP: ${ADMIN_NIP:-ADMIN001}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
      ADMIN_TECHNICIAN_CODE: ${ADMIN_TECHNICIAN_CODE:-ADMIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx256m}
    mem_limit: 400m

volumes:
  technicel_mysql_prod_data:
